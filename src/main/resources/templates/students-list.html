<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #1a202c;
        }
        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-name {
            font-size: 14px;
            color: #4a5568;
        }
        .user-name strong {
            color: #2b6cb0;
        }
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-logout {
            background-color: #e53e3e;
            color: white;
            border: none;
        }
        .btn-logout:hover {
            background-color: #c53030;
        }
        .btn-add {
            background-color: #3182ce;
            color: white;
            margin-bottom: 20px;
        }
        .btn-add:hover {
            background-color: #2b6cb0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #edf2f7;
            color: #4a5568;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
        }
        tr:hover {
            background-color: #f7fafc;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-danger {
            background-color: #fed7d7;
            color: #9b2c2c;
        }
        .badge-success {
            background-color: #c6f6d5;
            color: #22543d;
        }
        .empty-message {
            text-align: center;
            color: #718096;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Система учета студентов</h1>
        <div class="user-panel">
            <span class="user-name">Вы вошли как: <strong th:text="${currentUser}">admin</strong></span>
            <a th:href="@{/logout}" class="btn btn-logout">Выйти</a>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 18px; margin: 0; color: #4a5568;">Список зарегистрированных студентов</h2>
        <a th:href="@{/students/add}" class="btn btn-add">+ Добавить студента</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>ФИО Студента</th>
            <th>Курс</th>
            <th>Наличие задолженности</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}">1</td>
            <td th:text="${student.name}">Иванов Иван Иванович</td>
            <td th:text="${student.course}">2</td>
            <td>
                <span th:if="${student.hasDebt}" class="badge badge-danger">Есть долги</span>
                <span th:unless="${student.hasDebt}" class="badge badge-success">Задолженностей нет</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="4" class="empty-message">В базе данных пока нет ни одного студента. Нажмите кнопку выше, чтобы добавить.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
